name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: idf.py build (ESP32)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write AWS IoT certificates
        shell: bash
        env:
          AWS_IOT_CERT: ${{ secrets.AWS_IOT_CERT }}
          AWS_IOT_KEY:  ${{ secrets.AWS_IOT_KEY }}
          AWS_IOT_CA:   ${{ secrets.AWS_IOT_CA }}
        run: |
          mkdir -p main/certs
          printf '%s' "${AWS_IOT_CERT}" > main/certs/esp32-smart-cooking.cert.pem
          printf '%s' "${AWS_IOT_KEY}"  > main/certs/esp32-smart-cooking.private.key
          printf '%s' "${AWS_IOT_CA}"   > main/certs/AmazonRootCA1.pem
          echo "--- cert files written ---"
          ls -lh main/certs/

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Show firmware size
        run: |
          . /opt/esp/idf/export.sh
          idf.py size
          idf.py size-components

      - name: Upload firmware artefacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/compile_commands.json
            sdkconfig
          if-no-files-found: error